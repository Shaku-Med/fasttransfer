name = "fasttransfer-relay"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# The phone page's files are bundled as plain text and served by worker.js.
[[rules]]
type = "Text"
globs = ["**/static/*.html", "**/static/*.css", "**/static/*.js"]
fallthrough = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The free plan only runs SQLite backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
